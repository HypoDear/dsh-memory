<!DOCTYPE html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="DSH 长期记忆库 —— 开发经验、环境事实、踩过的坑">
<meta name="theme-color" content="#f4efe4">
<title>DSH 长期记忆</title>
<!-- 书页图标：与 web-server / mini-game 同一套内联 SVG data URI 写法 -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27><rect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%23f4efe4%27/><g fill=%27%231f6f8b%27><path d=%27M6 6.5h8.4c1.7 0 3 1.3 3 3v16.6c0-1.7-1.3-3-3-3H6z%27/><path d=%27M26 6.5h-8.4c-1.7 0-3 1.3-3 3v16.6c0-1.7 1.3-3 3-3H26z%27 opacity=%27.5%27/></g></svg>">
<style>
/* ═══ 主题令牌 ═══════════════════════════════════════════════════════
   paper：沿用 web-server / mini-game 的暖米色 + 青蓝强调色
   ink  ：暗色变体，同样偏暖，避免纯黑刺眼
   ─────────────────────────────────────────────────────────────────── */
:root{
  --paper:#f4efe4; --paper2:#fbf8f1; --paper3:#fffdf8;
  --ink:#2f2a24; --ink-soft:#7d7265; --ink-dim:#a39887;
  --line:#d8cfbe; --line-soft:#e6ddcd;
  --accent:#1f6f8b; --accent-soft:#eaf2f5; --accent-line:#cfe2e9;
  --code-bg:#f0e9dc; --code-ink:#3a4a52;
  --shadow:0 4px 16px rgba(47,42,36,.07);
  --r:12px;
  --font-title:"Kaiti SC","STKaiti",KaiTi,"Noto Serif SC","Songti SC",Georgia,serif;
  --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,"SF Mono",Consolas,"Liberation Mono",Menlo,monospace;
}
html[data-theme="ink"]{
  --paper:#1b1917; --paper2:#232120; --paper3:#2a2725;
  --ink:#e9e3d7; --ink-soft:#a79d8e; --ink-dim:#756d61;
  --line:#3a3633; --line-soft:#2e2b29;
  --accent:#6fb3c9; --accent-soft:#1f2d33; --accent-line:#2c4450;
  --code-bg:#161514; --code-ink:#cfd8dc;
  --shadow:0 6px 22px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--font-body); font-size:15.5px; line-height:1.75;
  -webkit-font-smoothing:antialiased;
  display:flex;
}

/* ═══ 侧栏 ═════════════════════════════════════════════════════════ */
#nav{
  width:288px; flex:0 0 288px; background:var(--paper2);
  border-right:1px solid var(--line);
  height:100vh; position:sticky; top:0; display:flex; flex-direction:column;
}
#brand{padding:22px 22px 14px; border-bottom:1px solid var(--line-soft)}
#brand .t{
  font-family:var(--font-title); font-size:20px; letter-spacing:3px;
  margin:0; display:flex; align-items:center; gap:9px;
}
#brand .t svg{width:20px;height:20px;fill:var(--accent);flex:none}
#brand .s{font-size:11.5px;color:var(--ink-dim);letter-spacing:.6px;margin-top:5px}
#search{
  margin:12px 18px 6px; padding:8px 12px; width:calc(100% - 36px);
  background:var(--paper3); border:1px solid var(--line); border-radius:9px;
  color:var(--ink); font-size:13px; font-family:var(--font-body); outline:none;
}
#search:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
#search::placeholder{color:var(--ink-dim)}
#tree{flex:1;overflow-y:auto;padding:8px 0 18px}
.grp{
  font-size:10.5px;letter-spacing:1.4px;color:var(--ink-dim);
  padding:14px 22px 6px;font-weight:600;
}
#nav a.item{
  display:flex;align-items:center;gap:9px;padding:7px 22px;
  color:var(--ink);text-decoration:none;font-size:13.5px;
  border-left:2px solid transparent;transition:background .13s,border-color .13s;
}
#nav a.item:hover{background:var(--paper3)}
#nav a.item.on{border-left-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
#nav a.item .dot{
  width:5px;height:5px;border-radius:50%;background:var(--line);
  flex:none;transition:background .13s;
}
#nav a.item.on .dot{background:var(--accent)}
#nav a.item .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 二级：当前文档的小节大纲 */
#nav a.sub{
  display:block;padding:4px 22px 4px 36px;font-size:12.5px;color:var(--ink-soft);
  border-left:2px solid transparent;text-decoration:none;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
#nav a.sub:hover{color:var(--accent);background:var(--paper3)}
#nav a.sub.on{color:var(--accent);border-left-color:var(--accent-line)}
#nores{padding:10px 22px;font-size:12.5px;color:var(--ink-dim);display:none}
#toolbar{
  border-top:1px solid var(--line-soft);padding:10px 18px;
  display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink-dim);
}
#toolbar button{
  background:var(--paper3);border:1px solid var(--line);border-radius:7px;
  color:var(--ink-soft);font-size:11.5px;padding:4px 10px;cursor:pointer;
  font-family:var(--font-body);transition:border-color .13s,color .13s;
}
#toolbar button:hover{border-color:var(--accent);color:var(--accent)}
#toolbar .sp{flex:1}
#toolbar a{color:var(--ink-dim);text-decoration:none}
#toolbar a:hover{color:var(--accent)}

/* ═══ 正文 ═════════════════════════════════════════════════════════ */
#main{flex:1;min-width:0;height:100vh;overflow-y:auto;scroll-behavior:smooth}
#doc{max-width:800px;margin:0 auto;padding:44px 40px 120px}
#doc h1,#doc h2,#doc h3,#doc h4{font-family:var(--font-title);font-weight:600;line-height:1.35}
#doc h1{font-size:29px;letter-spacing:1.5px;margin:0 0 8px}
#doc h2{font-size:21px;letter-spacing:1px;margin:2.1em 0 .7em;padding-bottom:.32em;border-bottom:1px solid var(--line-soft)}
#doc h3{font-size:17px;letter-spacing:.6px;margin:1.7em 0 .5em}
#doc h4{font-size:15px;margin:1.4em 0 .4em;color:var(--ink-soft)}
#doc p,#doc li{overflow-wrap:break-word}
#doc a{color:var(--accent);text-decoration:none;border-bottom:1px solid var(--accent-line)}
#doc a:hover{border-bottom-color:var(--accent)}
#doc strong{font-weight:600}
#doc hr{border:0;border-top:1px solid var(--line-soft);margin:2.4em 0}
#doc ul,#doc ol{padding-left:1.5em;margin:.6em 0}
#doc li{margin:.22em 0}
#doc code{
  font-family:var(--font-mono);font-size:85%;
  background:var(--code-bg);color:var(--code-ink);
  padding:.16em .42em;border-radius:5px;
}
#doc pre{
  background:var(--code-bg);border:1px solid var(--line);border-radius:var(--r);
  padding:15px 17px;overflow-x:auto;margin:1.1em 0;
}
#doc pre code{background:none;padding:0;font-size:12.8px;line-height:1.65;color:var(--code-ink)}
#doc blockquote{
  margin:1.1em 0;padding:.7em 1.1em;color:var(--ink-soft);
  background:var(--paper2);border-left:3px solid var(--accent-line);border-radius:0 8px 8px 0;
}
#doc blockquote p{margin:.3em 0}
#doc table{
  border-collapse:separate;border-spacing:0;width:100%;margin:1.2em 0;
  font-size:14px;display:block;overflow-x:auto;border-radius:var(--r);
  border:1px solid var(--line);
}
#doc th,#doc td{border-bottom:1px solid var(--line-soft);padding:8px 13px;text-align:left;vertical-align:top}
#doc tr:last-child td{border-bottom:0}
#doc th{background:var(--paper2);font-weight:600;font-family:var(--font-title);letter-spacing:.5px}
#doc tbody tr:hover{background:var(--paper2)}
#doc img{max-width:100%;border-radius:var(--r);border:1px solid var(--line)}
#meta{
  font-size:12.5px;color:var(--ink-dim);letter-spacing:.4px;
  padding-bottom:14px;margin-bottom:22px;border-bottom:1px solid var(--line-soft);
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
#meta .chip{
  background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-line);
  border-radius:20px;padding:1px 10px;font-size:11.5px;
}
#err{
  background:var(--paper2);border:1px solid var(--line);border-radius:var(--r);
  padding:22px 24px;color:var(--ink-soft);font-size:14px;
}
#err code{background:var(--code-bg)}

#top{
  position:fixed;right:26px;bottom:26px;width:38px;height:38px;border-radius:50%;
  background:var(--paper2);border:1px solid var(--line);color:var(--ink-soft);
  cursor:pointer;font-size:16px;line-height:1;display:none;
  align-items:center;justify-content:center;
  box-shadow:var(--shadow);transition:color .15s,border-color .15s;
}
#top:hover{color:var(--accent);border-color:var(--accent)}
#top.show{display:flex}
#burger{display:none}
#scrim{display:none}

/* ═══ 响应式 ═══════════════════════════════════════════════════════ */
@media (max-width:860px){
  body{display:block}
  #nav{
    position:fixed;z-index:20;height:100vh;width:280px;flex:none;
    transform:translateX(-100%);transition:transform .22s ease;
    box-shadow:0 0 30px rgba(0,0,0,.18);
  }
  #nav.open{transform:none}
  #main{height:auto;overflow:visible}
  #doc{padding:64px 20px 100px}
  #doc h1{font-size:24px}
  #doc h2{font-size:19px}
  #burger{
    display:flex;position:fixed;top:13px;left:13px;z-index:21;
    width:38px;height:38px;align-items:center;justify-content:center;
    background:var(--paper2);border:1px solid var(--line);border-radius:9px;
    color:var(--ink);font-size:17px;cursor:pointer;box-shadow:var(--shadow);
  }
  #scrim{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:19}
  #scrim.on{display:block}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>

<button id="burger" aria-label="打开目录">☰</button>
<div id="scrim"></div>

<nav id="nav">
  <div id="brand">
    <h1 class="t">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M6 6.5h8.4c1.7 0 3 1.3 3 3v16.6c0-1.7-1.3-3-3-3H6z"/><path d="M26 6.5h-8.4c-1.7 0-3 1.3-3 3v16.6c0-1.7 1.3-3 3-3H26z" opacity=".5"/></svg>
      DSH 记忆
    </h1>
    <div class="s">开发经验 · 环境事实 · 踩过的坑</div>
  </div>

  <input id="search" type="search" placeholder="筛选条目…" autocomplete="off" spellcheck="false">
  <div id="tree"></div>
  <div id="nores">没有匹配的条目</div>

  <div id="toolbar">
    <button id="theme" title="切换配色">◐ 墨色</button>
    <span class="sp"></span>
    <a href="https://github.com/HypoDear/dsh-memory" target="_blank" rel="noopener">GitHub ↗</a>
  </div>
</nav>

<main id="main"><article id="doc"><div id="meta">载入中…</div></article></main>
<button id="top" aria-label="回到顶部">↑</button>

<script>
/* ═══ 极简 Markdown 渲染器 ══════════════════════════════════════════
   无外部依赖 —— 不引任何 CDN，避免网络不可达时整页失效。
   支持：标题 / 段落 / 列表 / 表格 / 围栏代码 / 引用 / 分隔线 /
        行内代码 / 粗体 / 斜体 / 删除线 / 链接 / 图片
   ─────────────────────────────────────────────────────────────────── */
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const slug = s => s.toLowerCase().replace(/[^\w\u4e00-\u9fa5]+/g,'-').replace(/^-|-$/g,'');

function inline(s){
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (_,c) => `\u0000${codes.push(c)-1}\u0000`);
  s = esc(s);
  s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g,'<img src="$2" alt="$1" loading="lazy">');
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,(m,t,h)=>{
    // 站内 .md 链接转成 hash 路由；外部链接新窗口打开
    const internal = /^(?!https?:|mailto:|#|\/)/.test(h) && /\.md(#|$)/.test(h);
    if(internal){
      const [p,frag] = h.split('#');
      return `<a href="#/${p.replace(/^\.\//,'').replace(/^.*\//,'').replace(/\.md$/,'')}${frag?'#'+frag:''}">${t}</a>`;
    }
    const ext = /^https?:/.test(h);
    return `<a href="${h}"${ext?' target="_blank" rel="noopener"':''}>${t}</a>`;
  });
  s = s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s = s.replace(/(^|[^*\w])\*([^*\n]+)\*/g,'$1<em>$2</em>');
  s = s.replace(/~~([^~]+)~~/g,'<del>$1</del>');
  s = s.replace(/\u0000(\d+)\u0000/g,(_,i)=>`<code>${esc(codes[+i])}</code>`);
  return s;
}

/** 渲染 Markdown，同时把二/三级标题收进 outline 供侧栏大纲使用。 */
function render(md, outline){
  const lines = md.replace(/\r\n?/g,'\n').split('\n');
  let out = '', i = 0, list = null;
  const close = () => { if(list){ out += `</${list}>\n`; list = null; } };

  while(i < lines.length){
    const ln = lines[i];

    if(/^\s*```/.test(ln)){
      close();
      const buf = []; i++;
      while(i < lines.length && !/^\s*```\s*$/.test(lines[i])) buf.push(lines[i++]);
      i++;
      out += `<pre><code>${esc(buf.join('\n'))}</code></pre>\n`;
      continue;
    }

    // 表格：下一行是分隔行才认，避免把普通含 | 的段落当表格
    if(/^\s*\|/.test(ln) && i+1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i+1])){
      close();
      const cells = r => r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      const head = cells(ln); i += 2;
      let body = '';
      while(i < lines.length && /^\s*\|/.test(lines[i])){
        body += '<tr>' + cells(lines[i]).map(c=>`<td>${inline(c)}</td>`).join('') + '</tr>\n';
        i++;
      }
      out += `<table><thead><tr>${head.map(c=>`<th>${inline(c)}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table>\n`;
      continue;
    }

    const h = ln.match(/^(#{1,6})\s+(.*)$/);
    if(h){
      close();
      const lv = h[1].length, id = slug(h[2]);
      if(lv === 2 || lv === 3) outline.push({ lv, id, text: h[2] });
      out += `<h${lv} id="${id}">${inline(h[2])}</h${lv}>\n`;
      i++; continue;
    }

    if(/^\s*([-*_])\s*\1\s*\1[\s\1]*$/.test(ln)){ close(); out += '<hr>\n'; i++; continue; }

    if(/^\s*>/.test(ln)){
      close();
      const buf = [];
      while(i < lines.length && /^\s*>/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/,''));
      out += `<blockquote>${render(buf.join('\n'), [])}</blockquote>\n`;
      continue;
    }

    const li = ln.match(/^(\s*)([-*+]|\d+\.)\s+(.*)$/);
    if(li){
      const want = /^\d/.test(li[2]) ? 'ol' : 'ul';
      if(list !== want){ close(); out += `<${want}>\n`; list = want; }
      let text = li[3]; i++;
      // 续行：既不空行也不构成新块的行并入本项
      while(i < lines.length){
        const nx = lines[i];
        if(/^\s*$/.test(nx) || /^(\s*)([-*+]|\d+\.)\s+/.test(nx) || /^#{1,6}\s/.test(nx) ||
           /^\s*>/.test(nx) || /^\s*```/.test(nx) || /^\s*\|/.test(nx)) break;
        text += ' ' + nx.trim(); i++;
      }
      out += `<li>${inline(text)}</li>\n`;
      continue;
    }

    if(/^\s*$/.test(ln)){ close(); i++; continue; }

    close();
    const buf = [ln]; i++;
    while(i < lines.length && !/^\s*$/.test(lines[i]) &&
          !/^(#{1,6}\s|\s*[-*+]\s|\s*\d+\.\s|\s*>|\s*```|\s*\|)/.test(lines[i])){
      buf.push(lines[i++]);
    }
    out += `<p>${inline(buf.join('\n'))}</p>\n`;
  }
  close();
  return out;
}

/* ═══ 状态与路由 ═══════════════════════════════════════════════════ */
const $doc = document.getElementById('doc');
const $tree = document.getElementById('tree');
const $nav = document.getElementById('nav');
const $scrim = document.getElementById('scrim');
const $nores = document.getElementById('nores');
const $search = document.getElementById('search');
const $main = document.getElementById('main');
const $top = document.getElementById('top');

let MANIFEST = { docs: [], memories: [] };
let OUTLINE = [];
let CURRENT = null;

const all = () => [...(MANIFEST.docs||[]), ...(MANIFEST.memories||[])];

/** 渲染侧栏；仅当前文档展开其小节大纲，避免列表过长。 */
function drawTree(activeSlug){
  const q = $search.value.trim().toLowerCase();
  const match = d => !q || (d.title + ' ' + (d.summary||'') + ' ' + (d.tags||[]).join(' ')).toLowerCase().includes(q);
  let html = '', any = false;

  const group = (label, items) => {
    const shown = items.filter(match);
    if(!shown.length) return '';
    any = true;
    let s = `<div class="grp">${label}</div>`;
    for(const d of shown){
      const on = d.slug === activeSlug;
      s += `<a class="item${on?' on':''}" href="#/${d.slug}" title="${esc(d.summary||'')}">`
         + `<span class="dot"></span><span class="lbl">${esc(d.title)}</span></a>`;
      if(on && OUTLINE.length){
        for(const o of OUTLINE){
          s += `<a class="sub" href="#/${d.slug}#${o.id}" data-anchor="${o.id}"`
             + ` style="padding-left:${o.lv===3?46:36}px">${esc(o.text)}</a>`;
        }
      }
    }
    return s;
  };

  html += group('说明', MANIFEST.docs||[]);
  html += group('记忆', MANIFEST.memories||[]);
  $tree.innerHTML = html;
  $nores.style.display = any ? 'none' : 'block';
}

async function load(slugName){
  const entry = all().find(d => d.slug === slugName) || all()[0];
  if(!entry){ $doc.innerHTML = '<div id="err">manifest.json 里没有任何文档。</div>'; return; }
  CURRENT = entry;
  OUTLINE = [];
  drawTree(entry.slug);
  $doc.innerHTML = '<div id="meta">载入中…</div>';

  try{
    const res = await fetch(entry.file + '?t=' + Date.now(), {cache:'no-cache'});
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const md = await res.text();
    const body = render(md, OUTLINE);
    const chips = (entry.tags||[]).map(t=>`<span class="chip">${esc(t)}</span>`).join('');
    $doc.innerHTML = `<div id="meta"><span>${esc(entry.file)}</span>${chips}</div>` + body;
    document.title = entry.title + ' · DSH 记忆';
    drawTree(entry.slug);   // 大纲已就绪，重绘以带出小节
    const frag = (location.hash.split('#')[2]||'');
    if(frag){ const t = document.getElementById(frag); if(t) t.scrollIntoView(); }
    else $main.scrollTop = 0;
    $top.classList.toggle('show', $main.scrollTop > 400);
  }catch(e){
    $doc.innerHTML = `<div id="err"><strong>载入 ${esc(entry.file)} 失败</strong>：${esc(e.message)}<br><br>
      若你是<strong>在本机双击打开</strong>这个 HTML，浏览器会因安全策略拒绝读取同目录文件。<br>
      请改用 <code>python -m http.server</code> 起个本地服务，或直接访问 Pages 站点。</div>`;
  }
}

function route(){
  const s = (location.hash.replace(/^#\/?/,'').split('#')[0]) || 'readme';
  load(s);
}

/* ═══ 交互 ═════════════════════════════════════════════════════════ */
document.getElementById('burger').onclick = () => {
  $nav.classList.add('open'); $scrim.classList.add('on');
};
$scrim.onclick = () => { $nav.classList.remove('open'); $scrim.classList.remove('on'); };

// 滚动时高亮当前小节
$main.addEventListener('scroll', () => {
  $top.classList.toggle('show', $main.scrollTop > 400);
  if(!OUTLINE.length) return;
  let cur = OUTLINE[0].id;
  for(const o of OUTLINE){
    const el = document.getElementById(o.id);
    if(el && el.getBoundingClientRect().top <= 120) cur = o.id;
  }
  document.querySelectorAll('#nav a.sub').forEach(a => {
    a.classList.toggle('on', a.dataset.anchor === cur);
  });
}, {passive:true});

$top.onclick = () => $main.scrollTo({top:0});
$search.oninput = () => drawTree(CURRENT ? CURRENT.slug : null);

// 主题切换（记住选择）
const $theme = document.getElementById('theme');
function setTheme(t){
  document.documentElement.dataset.theme = t;
  $theme.textContent = t === 'ink' ? '◑ 纸张' : '◐ 墨色';
  document.querySelector('meta[name=theme-color]')
    .setAttribute('content', t === 'ink' ? '#1b1917' : '#f4efe4');
  try{ localStorage.setItem('dsh-memory-theme', t); }catch{}
}
$theme.onclick = () => setTheme(document.documentElement.dataset.theme === 'ink' ? 'paper' : 'ink');
try{
  const saved = localStorage.getItem('dsh-memory-theme');
  if(saved) setTheme(saved);
}catch{}

window.addEventListener('hashchange', () => {
  route();
  $nav.classList.remove('open'); $scrim.classList.remove('on');
});

(async () => {
  try{
    const res = await fetch('manifest.json?t=' + Date.now(), {cache:'no-cache'});
    MANIFEST = await res.json();
  }catch{
    MANIFEST = {docs:[{slug:'readme',file:'README.md',title:'首页',summary:''}], memories:[]};
  }
  route();
})();
</script>
